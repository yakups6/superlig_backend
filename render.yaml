services:
  - type: web
    name: superlig-backend
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate"
    startCommand: "gunicorn core.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: USE_SQLITE
        value: "true"
      - key: SECRET_KEY
        generateValue: true


